<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexcuse | Dashboard</title>
    <link rel="stylesheet" href="css/dashboard-style.css">
    <!-- Boxicons for the professional look -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo-section">
            <i class='bx bxl-visual-studio'></i>
            <span class="logo-name">Nexcuse</span>
        </div>
        
        <ul class="nav-links">
            <li><a href="#" class="active"><i class='bx bx-home-alt'></i> Home</a></li>
            <li><a href="#"><i class='bx bx-folder'></i> Homework</a></li>
            <li><a href="#"><i class='bx bx-book'></i> Classwork</a></li>
            <li><a href="#"><i class='bx bx-bot'></i> NovaAI</a></li>
            <li><a href="#"><i class='bx bx-note'></i> Notes</a></li>
        </ul>

        <!-- Admin Only Toggle -->
        <div id="admin-controls" class="admin-zone" style="display: none;">
            <p class="label">ADMIN PANEL</p>
            <button class="upload-btn"><i class='bx bx-cloud-upload'></i> Upload New</button>
        </div>

        <div class="user-footer">
            <button id="logout-btn"><i class='bx bx-log-out'></i> Sign Out</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="content">
        <header class="header">
            <h1 id="welcome-msg">Welcome, Student</h1>
            <div id="admin-pill" class="pill" style="display: none;">Admin Access</div>
        </header>

        <div class="dashboard-grid">
            <!-- These cards will eventually be populated by your Drive API -->
            <div class="card">
                <h3>Latest Homework</h3>
                <div class="preview-box">Empty - No Uploads</div>
            </div>
            <div class="card">
                <h3>NovaAI Status</h3>
                <p>System: Online</p>
            </div>
        </div>
    </main>

    <script src="js/dashboard-logic.js"></script>
</body>
</html>
