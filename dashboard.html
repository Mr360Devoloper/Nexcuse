<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexcuse | Auth</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="brand">
                <div class="nova-core"></div>
                <h1>Nexcuse</h1>
            </div>
            
            <h2 id="auth-title">Login</h2>
            
            <form id="auth-form">
                <input type="email" id="email" placeholder="School Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" id="submit-btn" class="main-btn">Enter Workspace</button>
            </form>

            <p class="toggle-text">
                Need access? <span id="toggle-link">Create Account</span>
            </p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth-logic.js"></script>
</body>
</html>
