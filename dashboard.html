<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexcuse | Dashboard</title>
    <link rel="stylesheet" href="css/dashboard-style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-section">
            <i class='bx bxl-visual-studio'></i>
            <span class="logo-name">Nexcuse</span>
        </div>
        
        <ul class="nav-links">
            <li><a href="#" class="active"><i class='bx bx-home-alt'></i> Home</a></li>
            <li><a href="#"><i class='bx bx-folder'></i> Homework</a></li>
            <li><a href="#"><i class='bx bx-book'></i> Classwork</a></li>
            <li><a href="#"><i class='bx bx-bot'></i> NovaAI</a></li>
            <li><a href="#"><i class='bx bx-note'></i> Notes</a></li>
        </ul>

        <div id="admin-controls" class="admin-zone" style="display: none;">
            <p class="label">ADMIN PANEL</p>
            <button class="upload-btn"><i class='bx bx-cloud-upload'></i> Upload New</button>
        </div>

        <div class="user-footer">
            <button id="logout-btn"><i class='bx bx-log-out'></i> Sign Out</button>
        </div>
    </aside>

    <main class="content">
        <header class="header">
            <h1 id="welcome-msg">Welcome, Student</h1>
            <div id="admin-pill" class="pill" style="display: none;">Admin Access</div>
            <button onclick="fetchNexcuseData()" class="refresh-btn"><i class='bx bx-refresh'></i></button>
        </header>

        <div class="dashboard-grid">
            
            <div class="card homework-section">
                <div class="card-header">
                    <h3><i class='bx bx-notification'></i> Pending Homework</h3>
                    <span class="effort-badge">Effort Required</span>
                </div>
                <div id="hw-list" class="reminders-container">
                    <p class="status-msg">Fetching reminders...</p>
                </div>
            </div>

            <div class="card classwork-section">
                <div class="card-header">
                    <h3><i class='bx bx-book-content'></i> Classwork Library</h3>
                </div>
                <div id="cw-grid" class="asset-grid">
                    <p class="status-msg">Loading files...</p>
                </div>
            </div>

            <div class="card mini-card">
                <h3>NovaAI Status</h3>
                <div class="status-indicator">
                    <span class="dot"></span>
                    <p>Nova System: Online</p>
                </div>
            </div>
            
        </div>
    </main>

    <script src="js/dashboard-logic.js"></script>
    <script src="js/drive-logic.js"></script>
</body>
</html>
