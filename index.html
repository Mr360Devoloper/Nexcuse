<div class="auth-wrapper">
    <div class="auth-card">
        <div class="brand">
            <div class="nova-core"></div> <!-- Pulsing Blue Core -->
            <h1>Nexcuse</h1>
        </div>
        
        <div id="form-title">Login</div>
        
        <form id="auth-form">
            <div class="input-group">
                <input type="email" id="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="main-btn">Proceed</button>
        </form>

        <p class="toggle-text">
            New here? <span id="toggle-auth">Create an account</span>
        </p>
    </div>
</div>
