<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexcuse | Login</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="brand">
            <div class="nova-core"></div> <!-- Pulsing Blue Core -->
            <h1>Nexcuse</h1>
        </div>
        
        <div id="form-title">Login</div>
        
        <form id="auth-form">
            <div class="input-group">
                <input type="email" id="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="main-btn">Proceed</button>
        </form>

        <p class="toggle-text">
            New here? <a href="signup.html" id="toggle-auth" style="text-decoration: none; color: #38bdf8;">Create an account</a>
        </p>
    </div>
</div>
